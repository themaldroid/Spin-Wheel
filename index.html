<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spin Wheel dengan Peluang Kustom</title>
<style>
:root{--bg:#eef1f6;--card:#fff;--ink:#14213d;--mute:#5d6b86;--line:#d5dbe7;--accent:#e4572e;--accent-ink:#fff;--win:#1b9e6b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1420;--card:#182033;--ink:#eef1f8;--mute:#9aa7c2;--line:#2a3550;--accent:#ff7a4d;--accent-ink:#1a0d07;--win:#3ed598}}
:root[data-theme="dark"]{--bg:#0f1420;--card:#182033;--ink:#eef1f8;--mute:#9aa7c2;--line:#2a3550;--accent:#ff7a4d;--accent-ink:#1a0d07;--win:#3ed598}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
[hidden]{display:none!important}
main{max-width:520px;margin:0 auto;padding:20px 16px 40px}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(100%,460px);background:var(--bg);overflow:auto;padding:16px;padding-top:calc(16px + env(safe-area-inset-top,0px));display:grid;gap:16px;align-content:start;box-shadow:-8px 0 30px rgba(0,0,0,.35);z-index:10}
.dhead{display:flex;justify-content:space-between;align-items:center}
.dhead h2{margin:0;font-size:1.2rem}
#gear{position:fixed;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));width:40px;height:40px;padding:0;border-radius:50%;font-size:1.2rem;opacity:.22;z-index:5}
#gear:hover,#gear:focus-visible{opacity:1}
.pinbox{position:fixed;inset:0;background:rgba(0,0,0,.55);display:grid;place-items:center;z-index:20;padding:16px}
.pinbox .card{width:min(100%,320px);display:grid;gap:10px}
.pinbox input{padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
h1{font-size:1.5rem;margin:0 0 4px;letter-spacing:-.01em}
h2{font-size:1.05rem;margin:0 0 10px}
p.sub{margin:0 0 14px;color:var(--mute);font-size:.92rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.stage{display:flex;flex-direction:column;align-items:center;gap:14px}
.wheel-wrap{position:relative;width:min(100%,440px);aspect-ratio:1}
canvas{width:100%;height:100%;display:block}
.pointer{position:absolute;left:50%;top:-6px;transform:translateX(-50%);width:0;height:0;border-left:15px solid transparent;border-right:15px solid transparent;border-top:32px solid var(--ink);filter:drop-shadow(0 2px 2px rgba(0,0,0,.3))}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 12px}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700;font-size:1.1rem;padding:12px 40px}
button:disabled{opacity:.55;cursor:not-allowed}
.result{min-height:2.6em;text-align:center;font-weight:700;font-size:1.2rem}
.result.win{color:var(--win)}
.row{display:grid;grid-template-columns:28px 1fr 34px;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.row.w{grid-template-columns:1fr 90px 56px}
.row.w .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tabs{display:flex;gap:6px}.tabs button{flex:1}
.tabs button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.row.head{font-size:.82rem;color:var(--mute);border-bottom:2px solid var(--line)}
.row input[type=text],.row input[type=number]{width:100%;padding:7px 8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;min-width:0}
.row input[type=color]{width:28px;height:28px;border:none;padding:0;background:none;cursor:pointer}
.pct{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.row .del{padding:4px 0;color:var(--mute)}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.note{font-size:.85rem;color:var(--mute);margin-top:10px}
.opt{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:.92rem}
.opt input{accent-color:var(--accent)}
ol#hist{margin:0;padding-left:20px;font-size:.92rem;max-height:160px;overflow:auto}
.warn{color:var(--accent);font-size:.88rem;margin-top:8px;min-height:1.3em}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style>
</head>
<body>
<main>
  <section class="card stage">
    <h1 style="width:100%;text-align:center">Spin Wheel</h1>
    <div class="wheel-wrap"><div class="pointer"></div><canvas id="c" width="880" height="880" aria-label="Roda hadiah"></canvas></div>
    <button class="primary" id="spin">PUTAR</button>
    <div class="result" id="result" aria-live="polite">Tekan Putar untuk mulai</div>
  </section>

  <aside id="drawer" class="drawer" hidden aria-label="Pengaturan">
    <div class="dhead"><h2>Pengaturan</h2><button id="close">Tutup</button></div>
    <nav class="tabs"><button data-t="p-prize" class="on">Hadiah</button><button data-t="p-weight">--</button><button data-t="p-hist">Riwayat</button></nav>
    <div class="card" id="p-prize">
      <h2>Daftar hadiah</h2>
      <div id="list"></div>
      <div class="actions">
        <button id="add">Tambah hadiah</button>
        <button id="reset">Reset</button>
      </div>
      <label class="opt"><input type="checkbox" id="remove"> Hapus hadiah setelah menang</label>
      <label class="opt" style="flex-wrap:wrap">PIN pengaturan (opsional): <input type="text" id="pinset" inputmode="numeric" maxlength=8 placeholder="kosong = tanpa PIN" style="padding:7px 8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;width:170px"></label>
      </div>
    <div class="card" id="p-weight" hidden>
      <h2>Bobot peluang</h2>
      <div class="row w head"><span>Hadiah</span><span>Bobot</span><span style="text-align:right">Peluang</span></div>
      <div id="wlist"></div>
      <div class="warn" id="warn" role="status"></div>
      <div class="actions"><button id="even">Samakan peluang</button></div>
      <label class="opt" style="flex-wrap:wrap">PIN menu bobot (opsional): <input type="text" id="wpinset" inputmode="numeric" maxlength=8 placeholder="kosong = tanpa PIN" style="padding:7px 8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;width:170px"></label>
      <p class="note">Bobot 0 berarti tidak pernah menang. Peluang = bobot ÷ total bobot. Contoh: bobot 1 dan 9 → peluang 10% dan 90%.</p>
    </div>
    <div class="card" id="p-hist" hidden>
      <h2>Riwayat putaran</h2>
      <ol id="hist"></ol>
      <p class="note" id="stat"></p>
    </div>
  </aside>
</main>
<button id="gear" aria-label="Buka pengaturan">⚙</button>
<div id="pinbox" class="pinbox" hidden>
  <div class="card" role="dialog" aria-label="Masukkan PIN">
    <h2 style="margin:0" id="pintitle">Masukkan PIN</h2>
    <input type="password" id="pininput" inputmode="numeric" autocomplete="off">
    <div class="warn" id="pinerr"></div>
    <div class="actions" style="margin:0"><button class="primary" id="pinok" style="font-size:1rem;padding:8px 18px">Buka</button><button id="pincancel">Batal</button></div>
  </div>
</div>
<script>
const COLORS=['#e4572e','#f3a712','#29a37a','#2e86ab','#7b5ea7','#d1495b','#4f772d','#3d5a80'];
const DEFAULT=[['Hadiah Utama',2],['Voucher 50rb',8],['Voucher 20rb',20],['Kaos',10],['Stiker',30],['Coba Lagi',30]];
let items=[],rot=0,spinning=false,counts={},total=0;
const $=id=>document.getElementById(id);
const cv=$('c'),ctx=cv.getContext('2d');
let uid=0;
function load(){items=DEFAULT.map((d,i)=>({id:uid++,name:d[0],w:d[1],color:COLORS[i%COLORS.length]}));}
function sumW(){return items.reduce((s,i)=>s+Math.max(0,+i.w||0),0);}

function draw(){
  const W=cv.width,R=W/2-14,n=items.length;
  ctx.clearRect(0,0,W,W);
  ctx.save();ctx.translate(W/2,W/2);
  ctx.beginPath();ctx.arc(0,0,R+10,0,7);ctx.fillStyle=getComputedStyle(document.body).getPropertyValue('--ink');ctx.fill();
  if(!n){ctx.restore();return;}
  const a=2*Math.PI/n;
  ctx.rotate(rot);
  items.forEach((it,i)=>{
    ctx.beginPath();ctx.moveTo(0,0);ctx.arc(0,0,R,i*a,(i+1)*a);ctx.closePath();
    ctx.fillStyle=it.color;ctx.fill();ctx.lineWidth=3;ctx.strokeStyle='rgba(255,255,255,.85)';ctx.stroke();
    ctx.save();ctx.rotate(i*a+a/2);ctx.textAlign='right';ctx.textBaseline='middle';
    ctx.fillStyle='#fff';ctx.shadowColor='rgba(0,0,0,.45)';ctx.shadowBlur=4;
    let fs=Math.max(18,Math.min(38,R*1.6/n+8));ctx.font='700 '+fs+'px system-ui,sans-serif';
    let t=it.name||'-';while(ctx.measureText(t).width>R*0.68&&t.length>3){t=t.slice(0,-2);}
    if(t!==(it.name||'-'))t=t.trim()+'…';
    ctx.fillText(t,R-24,0);ctx.restore();
  });
  ctx.restore();
  ctx.save();ctx.translate(W/2,W/2);ctx.beginPath();ctx.arc(0,0,34,0,7);
  ctx.fillStyle='#fff';ctx.fill();ctx.lineWidth=8;ctx.strokeStyle=getComputedStyle(document.body).getPropertyValue('--ink');ctx.stroke();ctx.restore();
}

function renderList(){
  const L=$('list');L.innerHTML='';const tw=sumW();
  items.forEach(it=>{
    const r=document.createElement('div');r.className='row';
    r.innerHTML='<input type="color" aria-label="Warna">'+
      '<input type="text" maxlength="30" aria-label="Nama hadiah">'+
      '<button class="del" aria-label="Hapus">✕</button>';
    const [col,nm,del]=r.children;
    col.value=it.color;nm.value=it.name;
    col.oninput=()=>{it.color=col.value;draw();};
    nm.oninput=()=>{it.name=nm.value;draw();renderW();};
    del.onclick=()=>{if(spinning)return;items=items.filter(x=>x!==it);renderList();draw();};
    r.dataset.id=it.id;L.appendChild(r);
  });
  renderW();
  validate();
}
function pctText(it,tw){return tw>0?((Math.max(0,+it.w||0)/tw)*100).toFixed(1).replace(/\.0$/,'')+'%':'-';}
function renderW(){
  const L=$('wlist');L.innerHTML='';const tw=sumW();
  items.forEach(it=>{
    const r=document.createElement('div');r.className='row w';
    r.innerHTML='<span class="nm"></span><input type="number" min="0" step="any" aria-label="Bobot"><span class="pct"></span>';
    const [nm,w,pc]=r.children;
    nm.textContent=it.name||'-';nm.style.borderLeft='6px solid '+it.color;nm.style.paddingLeft='8px';
    w.value=it.w;pc.textContent=pctText(it,tw);
    w.oninput=()=>{it.w=w.value===''?0:Math.max(0,+w.value);updatePct();};
    L.appendChild(r);
  });
}
function updatePct(){
  const tw=sumW();
  [...$('wlist').children].forEach((r,i)=>{r.querySelector('.pct').textContent=pctText(items[i],tw);});
  validate();
}
function validate(){
  const w=$('warn');
  if(items.length<2){w.textContent='Minimal 2 hadiah.';}
  else if(sumW()<=0){w.textContent='Total bobot harus lebih dari 0.';}
  else w.textContent='';
  $('spin').disabled=spinning||items.length<2||sumW()<=0;
}

function pick(){
  const tw=sumW();let r=Math.random()*tw;
  for(let i=0;i<items.length;i++){const w=Math.max(0,+items[i].w||0);if(r<w)return i;r-=w;}
  return items.findIndex(i=>(+i.w||0)>0);
}

function spin(){
  if(spinning)return;validate();if($('spin').disabled)return;
  const idx=pick(),n=items.length,a=2*Math.PI/n;
  const jitter=(Math.random()-.5)*a*.7;
  const target=-Math.PI/2-(idx+.5)*a+jitter;
  const delta=(((target-rot)%(2*Math.PI))+2*Math.PI)%(2*Math.PI);
  const start=rot,end=rot+delta+2*Math.PI*(6+Math.floor(Math.random()*3));
  const dur=5200,t0=performance.now();
  spinning=true;$('spin').disabled=true;$('result').className='result';$('result').textContent='Berputar…';
  const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
  (function frame(now){
    let p=Math.min(1,(now-t0)/(reduce?400:dur));
    rot=start+(end-start)*(1-Math.pow(1-p,4));
    draw();
    if(p<1)requestAnimationFrame(frame);else finish(idx);
  })(t0);
}

function finish(idx){
  spinning=false;const it=items[idx];
  $('result').className='result win';$('result').textContent='🎉 '+it.name;
  counts[it.name]=(counts[it.name]||0)+1;total++;
  const li=document.createElement('li');li.textContent=it.name;$('hist').prepend(li);
  $('stat').textContent='Total putaran: '+total+' — '+Object.entries(counts).map(([k,v])=>k+' '+v+'× ('+Math.round(v/total*100)+'%)').join(', ');
  if($('remove').checked){items.splice(idx,1);renderList();draw();}else validate();
}

$('spin').onclick=spin;
$('add').onclick=()=>{if(spinning)return;items.push({id:uid++,name:'Hadiah '+(items.length+1),w:10,color:COLORS[items.length%COLORS.length]});renderList();draw();};
$('even').onclick=()=>{if(spinning)return;items.forEach(i=>i.w=1);renderList();};
$('reset').onclick=()=>{if(spinning)return;load();counts={};total=0;$('hist').innerHTML='';$('stat').textContent='';$('result').className='result';$('result').textContent='Tekan Putar untuk mulai';renderList();draw();};
matchMedia('(prefers-color-scheme:dark)').addEventListener('change',draw);
let pin='';try{pin=localStorage.getItem('sw_pin')||''}catch(_){}
const drawer=$('drawer'),dlg=$('pinbox');
let pinTarget='drawer',wUnlocked=false,weightPin='';try{weightPin=localStorage.getItem('sw_wpin')||''}catch(_){}
const panels=['p-prize','p-weight','p-hist'];
function showTab(id){panels.forEach(p=>{$(p).hidden=p!==id;});document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===id));}
function askPin(t){pinTarget=t;$('pininput').value='';$('pinerr').textContent='';$('pintitle').textContent=t==='weight'?'PIN menu bobot':'Masukkan PIN';dlg.hidden=false;$('pininput').focus();}
function openDrawer(){drawer.hidden=false;wUnlocked=false;showTab('p-prize');$('pinset').value=pin;$('wpinset').value=weightPin;$('close').focus();}
function closeDrawer(){drawer.hidden=true;wUnlocked=false;$('gear').focus();}
document.querySelectorAll('.tabs button').forEach(b=>{b.onclick=()=>{if(b.dataset.t==='p-weight'&&weightPin&&!wUnlocked){askPin('weight');return;}showTab(b.dataset.t);};});
$('wpinset').oninput=e=>{weightPin=e.target.value.trim();try{localStorage.setItem('sw_wpin',weightPin)}catch(_){}};
$('gear').onclick=()=>{if(!pin){openDrawer();return;}askPin('drawer');};
$('pinok').onclick=()=>{const ok=$('pininput').value===(pinTarget==='weight'?weightPin:pin);if(!ok){$('pinerr').textContent='PIN salah.';return;}dlg.hidden=true;if(pinTarget==='weight'){wUnlocked=true;showTab('p-weight');}else openDrawer();};
$('pininput').onkeydown=e=>{if(e.key==='Enter')$('pinok').click();};
$('pincancel').onclick=()=>{dlg.hidden=true;};
$('close').onclick=closeDrawer;
$('pinset').oninput=e=>{pin=e.target.value.trim();try{localStorage.setItem('sw_pin',pin)}catch(_){}};
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!drawer.hidden)closeDrawer();dlg.hidden=true;}});
load();renderList();draw();
</script>
</body>
</html>
